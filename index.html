<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BISWA MODS STORE</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101c;color:#fff;font:15px system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:12px}.top,.card{background:#101b2b;border:1px solid #29405e;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 15px 45px #0006}.top{position:sticky;top:8px;z-index:3;display:flex;gap:12px;align-items:center;background:#0d1828e8;backdrop-filter:blur(12px)}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#348bff,#7657ff);font-size:22px}.muted{color:#99a9c1}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin:5px 0;background:linear-gradient(135deg,#3189ff,#1765d4);color:#fff;font-weight:800;cursor:pointer;transition:.15s}.btn:active{transform:scale(.97)}.alt{background:#1a2a40}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.price{font-size:18px}.qr{max-width:330px;width:100%;display:block;margin:10px auto;background:white;padding:7px;border-radius:14px}.count{text-align:center;font-size:31px;font-weight:900}.key{background:#07111f;border:1px solid #3a5b80;border-radius:13px;padding:14px;width:100%;color:#fff;text-align:left;font-family:monospace;word-break:break-all}.chat{background:#17304d;border-radius:18px 18px 5px 18px;padding:13px;margin:8px 0;animation:in .3s}.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6fb4ff;margin:0 2px;animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-5px)}}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}input{width:100%;padding:12px;border-radius:12px;border:1px solid #344d6d;background:#08111e;color:#fff;margin:5px 0}.hidden{display:none}.drop{border:1px dashed #496787;padding:15px;border-radius:14px;text-align:center}
</style></head><body><main class="app"><header class="top"><div class="logo">⚡</div><div><b>BISWA MODS STORE</b><div class="muted">Premium digital store</div></div></header><div id="v"></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getDatabase,ref,get,set,update,onValue}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';import{getStorage,ref as sr,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js';
const firebaseConfig={apiKey:'AIzaSyAOyV8yiD4hpNCQNVOjqd9bwOEb2ssGx4Q',authDomain:'biswabotstore.firebaseapp.com',databaseURL:'https://biswabotstore-default-rtdb.firebaseio.com',projectId:'biswabotstore',storageBucket:'biswabotstore.firebasestorage.app',messagingSenderId:'661675846800',appId:'1:661675846800:web:e1ea465238ea4eb6b5fc15'};const A=initializeApp(firebaseConfig),db=getDatabase(A),st=getStorage(A),V=document.getElementById('v'),DL='https://t.me/+iDtXpSdktsgwODQ9';
const QR={60:'qr_60.png',70:'qr_70.png',120:'qr_120.png',130:'qr_130.png',170:'qr_170.png',180:'qr_180.png',550:'qr_550.png',700:'qr_700.png',1100:'qr_1100.png',1700:'qr_1700.png'};let code=localStorage.biswaChatCode||(localStorage.biswaChatCode='BMS-'+crypto.randomUUID().replaceAll('-','').slice(0,8).toUpperCase()),products={},order=null,timer;
const F={biswa:{name:'🔥 BISWA PRODUCT',description:'Premium BISWA access',version:'Latest',durations:{a:{label:'1 Hour',price:60},b:{label:'3 Hours',price:130},c:{label:'6 Hours',price:170}}},dragon:{name:'🐉 DRAGON PRODUCT',description:'Premium DRAGON access',version:'Latest',durations:{a:{label:'1 Hour',price:70},b:{label:'3 Hours',price:140},c:{label:'6 Hours',price:180}}},immortal:{name:'👑 IMMORTAL PRODUCT',description:'Premium IMMORTAL access',version:'Latest',durations:{a:{label:'10 Days',price:550},b:{label:'15 Days',price:700},c:{label:'30 Days',price:1100},d:{label:'60 Days',price:1800}}}};
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){return'₹'+Number(x).toLocaleString('en-IN')}let AC;function click(){try{AC=AC||new AudioContext();let o=AC.createOscillator(),g=AC.createGain();o.frequency.value=430;g.gain.value=.035;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.08)}catch(e){}}document.addEventListener('click',e=>{if(e.target.closest('button'))click()});
async function load(){try{let s=await get(ref(db,'products'));products=s.val()||F}catch(e){products=F}}
function home(){V.innerHTML='<section class="card" style="text-align:center"><h1>✨ BISWA MODS STORE</h1><p class="muted">Telegram-style premium shopping experience</p></section><section class="card"><button class="btn" onclick="shop()">🛍️ SHOP</button><button class="btn alt" onclick="orders()">🔑 MY ORDER KEYS</button><button class="btn alt" onclick="profile()">👤 YOUR PROFILE</button><button class="btn alt" onclick="location.href=\''+DL+'\'">🌐 DOWNLOAD</button></section>'}
window.shop=async()=>{await load();V.innerHTML='<section class="card"><h2>Select Your Device</h2><button class="btn" onclick="android()">📱 Android</button><button class="btn alt" onclick="home()">🔙 Back</button></section>'};window.android=()=>{V.innerHTML='<section class="card"><h2>📱 Android</h2>'+Object.entries(products).filter(x=>x[1].enabled!==false).map(x=>'<button class="btn" onclick="prod(\''+x[0]+'\')">'+esc(x[1].name)+'</button>').join('')+'<button class="btn alt" onclick="home()">🔙 Back</button></section>'};window.prod=id=>{let p=products[id];V.innerHTML='<section class="card"><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.description)+'</p><p>Version: <b>'+esc(p.version||'Latest')+'</b></p><div class="grid">'+Object.entries(p.durations).map(x=>'<button class="btn" onclick="buy(\''+id+'\',\''+x[0]+'\')">'+esc(x[1].label)+'<br><span class="price">'+money(x[1].price)+'</span></button>').join('')+'</div><button class="btn alt" onclick="android()">🔙 Back</button></section>'};
window.buy=async(id,d)=>{let p=products[id],v=p.durations[d];order={orderId:'BMS-'+crypto.randomUUID().replaceAll('-','').slice(0,10).toUpperCase(),chatCode:code,productId:id,product:p.name,duration:v.label,price:Number(v.price),createdAt:Date.now(),expiresAt:Date.now()+300000,status:'pending'};await set(ref(db,'orders/'+order.orderId),order);await set(ref(db,'users/'+code),{chat_code:code,last_seen:Date.now()});listen(order.orderId);payment()};
function payment(){let q=QR[order.price];V.innerHTML='<section class="card"><h2>💳 Payment</h2><p><b>Product:</b> '+esc(order.product)+'<br><b>Duration:</b> '+esc(order.duration)+'<br><b>Price:</b> '+money(order.price)+'<br><b>Chat Code:</b> <code>'+code+'</code><br><b>Order ID:</b> <code>'+order.orderId+'</code></p>'+(q?'<img class="qr" src="'+q+'">':'<p class="muted">QR not uploaded for this price.</p>')+'<div id="c" class="count">05:00</div><p class="muted">Complete your payment within 5 minutes.<br>Payments after expiry will not be verified.<br>No key will be delivered.<br>No refund will be provided.</p><button class="btn" onclick="upload()">📸 SEND PAYMENT SCREENSHOT</button><button class="btn alt" onclick="home()">Cancel</button></section><div id="up"></div>';clearInterval(timer);timer=setInterval(()=>{let n=Math.max(0,Math.ceil((order.expiresAt-Date.now())/1000)),e=document.getElementById('c');if(e)e.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(!n){clearInterval(timer);update(ref(db,'orders/'+order.orderId),{status:'expired'});V.innerHTML='<section class="card"><h2>❌ Payment Expired</h2><p>Please create a new order.<br>Expired orders cannot be paid.</p><button class="btn" onclick="home()">🏠 Home</button></section>}},300)}
window.upload=()=>{document.getElementById('up').innerHTML='<section class="card"><h3>📸 Payment Screenshot</h3><div class="drop"><input id="file" type="file" accept="image/*"></div><button class="btn" onclick="sendShot()">📤 SEND SCREENSHOT</button></section>'};window.sendShot=async()=>{let f=file.files[0];if(!f)return alert('Select screenshot');if(Date.now()>order.expiresAt)return;let r=sr(st,'payment_screenshots/'+order.orderId+'/'+code+'.jpg');await uploadBytes(r,f,{contentType:f.type});let url=await getDownloadURL(r);await update(ref(db,'orders/'+order.orderId),{status:'payment_submitted',screenshot_url:url,submittedAt:Date.now()});V.innerHTML='<section class="card"><div class="chat">📸 Screenshot sent successfully.<br><br>⏳ Please wait for admin checking.</div><button class="btn" onclick="orders()">🔑 My Orders</button></section>'};
function listen(id){onValue(ref(db,'orders/'+id),s=>{let o=s.val();if(!o)return;order=o;if(o.status==='generating')gen();if(o.status==='approved'&&o.license_key)delivered(o);if(o.status==='rejected')V.innerHTML='<section class="card"><h2>❌ Payment Rejected</h2><button class="btn" onclick="home()">Home</button></section>'})}function gen(){V.innerHTML='<section class="card" style="text-align:center"><div class="chat">🤖 Payment approved!<br><br>⚡ Please wait, your order key is generating <span class="dots"><span></span><span></span><span></span></span></div></section>'}function delivered(o){V.innerHTML='<section class="card"><h2>🎉 Payment Successful</h2><p><b>Product:</b> '+esc(o.product)+'<br><b>Duration:</b> '+esc(o.duration)+'<br><b>Price:</b> '+money(o.price)+'</p><button class="key" onclick="copy(\''+esc(o.license_key)+'\')">'+esc(o.license_key)+'</button><p class="muted">Tap key to copy</p><button class="btn" onclick="location.href=\''+DL+'\'">⬇️ DOWNLOAD</button><button class="btn alt" onclick="orders()">🔑 My Orders</button></section>'}window.copy=async k=>{await navigator.clipboard.writeText(k);alert('License key copied!')};
window.orders=async()=>{let s=await get(ref(db,'orders'));let a=Object.values(s.val()||{}).filter(x=>x.chatCode===code);V.innerHTML='<section class="card"><h2>🔑 My Order Keys</h2>'+(a.length?a.reverse().map(o=>'<div class="card"><b>'+esc(o.product)+'</b><br>Duration: '+esc(o.duration)+'<br>Price: '+money(o.price)+'<br>Status: '+esc(o.status)+(o.license_key?'<br><br><button class="key" onclick="copy(\''+esc(o.license_key)+'\')">'+esc(o.license_key)+'</button><button class="btn" onclick="location.href=\''+DL+'\'">⬇️ Download</button>':'')+'</div>').join(''):'No orders yet.')+'<button class="btn alt" onclick="home()">🔙 Back</button></section>'};window.profile=()=>V.innerHTML='<section class="card"><h2>👤 Your Profile</h2><p>Your website chat code:</p><button class="key" onclick="copy(\''+code+'\')">'+code+'</button><p class="muted">Every user has a unique chat code. Admin uses this code to deliver your key.</p><button class="btn alt" onclick="home()">🔙 Back</button></section>';
home();
</script></body></html>
