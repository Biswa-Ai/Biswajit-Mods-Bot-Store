<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BISWA MODS STORE</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:Inter,system-ui}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#111827;border:1px solid #26334d;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 14px 40px #0005}h1{margin:0 0 7px}.muted{color:#9ca8bf}.btn{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:14px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn.alt{background:#202b40}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.qr{display:block;max-width:330px;width:100%;margin:15px auto;border-radius:15px;background:#fff}.key{background:#090f1d;border-radius:12px;padding:12px;word-break:break-all}.hidden{display:none}code{word-break:break-all}</style></head><body><main class="wrap"><section class="card"><h1>✨ BISWA MODS STORE</h1><div class="muted">Premium digital products store</div></section><div id="app"></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getDatabase,ref,get,push}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyAOyV8yiD4hpNCQNVOjqd9bwOEb2ssGx4Q',authDomain:'biswabotstore.firebaseapp.com',databaseURL:'https://biswabotstore-default-rtdb.firebaseio.com',projectId:'biswabotstore',storageBucket:'biswabotstore.firebasestorage.app',messagingSenderId:'661675846800',appId:'1:661675846800:web:e1ea465238ea4eb6b5fc15'};const db=getDatabase(initializeApp(firebaseConfig));const app=document.getElementById('app');
const QR={60:'qr_60.png',70:'qr_70.png',120:'qr_120.png',130:'qr_130.png',170:'qr_170.png',180:'qr_180.png',550:'qr_550.png',700:'qr_700.png',1100:'qr_1100.png',1700:'qr_1700.png'};
const fallback={biswa:{name:'🔥 BISWA PRODUCT',description:'Premium BISWA access.',version:'Latest',durations:{h1:{label:'1 Hour',price:60},h3:{label:'3 Hours',price:130},h6:{label:'6 Hours',price:170}}},dragon:{name:'🐉 DRAGON PRODUCT',description:'Premium DRAGON access.',version:'Latest',durations:{h1:{label:'1 Hour',price:70},h3:{label:'3 Hours',price:140},h6:{label:'6 Hours',price:180}}},immortal:{name:'👑 IMMORTAL PRODUCT',description:'Premium IMMORTAL access.',version:'Latest',durations:{d10:{label:'10 Days',price:550},d15:{label:'15 Days',price:700},d30:{label:'30 Days',price:1100},d60:{label:'60 Days',price:1800}}}};let products=fallback,orders=JSON.parse(localStorage.getItem('biswa_orders')||'[]');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n).toLocaleString('en-IN');
async function load(){try{const s=await get(ref(db,'products'));if(s.exists())products=s.val()}catch{}home()}
function home(){app.innerHTML=`<div class="card"><button class="btn" onclick="shop()">🛍️ SHOP</button><button class="btn alt" onclick="myOrders()">🔑 MY ORDER KEYS</button><button class="btn alt" onclick="profile()">👤 YOUR PROFILE</button><button class="btn alt" onclick="official()">🌐 OFFICIAL</button></div>`}
window.shop=()=>app.innerHTML=`<div class="card"><h2>Select Your Device</h2><button class="btn" onclick="android()">📱 Android</button><button class="btn alt" onclick="home()">🔙 Back</button></div>`;
window.android=()=>app.innerHTML=`<div class="card"><h2>📱 Android Products</h2>${Object.entries(products).filter(([,p])=>p.enabled!==false).map(([id,p])=>`<button class="btn" onclick="product('${id}')">${e(p.name)}</button>`).join('')}<button class="btn alt" onclick="home()">🔙 Back</button></div>`;
window.product=id=>{const p=products[id];app.innerHTML=`<div class="card"><h2>${e(p.name)}</h2><p class="muted">${e(p.description||'')}</p><p>Version: <b>${e(p.version||'Latest')}</b></p><h3>Select Duration</h3><div class="grid">${Object.entries(p.durations||{}).map(([d,v])=>`<button class="btn" onclick="buy('${id}','${d}')">${e(v.label)} — ${money(v.price)}</button>`).join('')}</div><button class="btn alt" onclick="android()">🔙 Back</button></div>`};
window.buy=async(id,d)=>{const p=products[id],v=p.durations[d],price=Number(v.price),oid='BMS-'+crypto.randomUUID().slice(0,8).toUpperCase(),exp=Date.now()+300000;const o={orderId:oid,productId:id,product:p.name,duration:v.label,price,status:'pending',createdAt:Date.now(),expiresAt:exp};orders.push(o);localStorage.setItem('biswa_orders',JSON.stringify(orders));try{await push(ref(db,'orders'),o)}catch{}const qr=QR[price];app.innerHTML=`<div class="card"><h2>💳 PAYMENT</h2><p><b>Product:</b> ${e(p.name)}<br><b>Duration:</b> ${e(v.label)}<br><b>Price:</b> ${money(price)}<br><b>Order ID:</b> <code>${oid}</code></p>${qr?`<img class="qr" src="${qr}" alt="QR ₹${price}">`:`<p>⚠️ QR for ${money(price)} is not uploaded.</p>`}<h2 id="timer">05:00</h2><p class="muted">Complete your payment within 5 minutes.<br>Payments after expiry will not be verified.<br>No key will be delivered.<br>No refund will be provided.</p><button class="btn" onclick="paid('${oid}')">📸 I HAVE PAID</button><button class="btn alt" onclick="home()">Cancel</button></div>`;const t=setInterval(()=>{const left=Math.max(0,exp-Date.now()),s=Math.ceil(left/1000),m=Math.floor(s/60),ss=s%60;const el=document.getElementById('timer');if(el)el.textContent=String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');if(!left){clearInterval(t);expire(oid)}},250)};
window.paid=async oid=>{const o=orders.find(x=>x.orderId===oid);if(!o)return;o.status='payment_submitted';localStorage.setItem('biswa_orders',JSON.stringify(orders));try{await push(ref(db,'payment_submissions'),o)}catch{}app.innerHTML=`<div class="card"><h2>📸 Payment Submitted</h2><p>Order <code>${oid}</code> is waiting for admin approval.</p><button class="btn" onclick="myOrders()">🔑 My Orders</button></div>`};window.expire=oid=>{const o=orders.find(x=>x.orderId===oid);if(o&&o.status==='pending'){o.status='expired';localStorage.setItem('biswa_orders',JSON.stringify(orders));app.innerHTML=`<div class="card"><h2>❌ Payment Expired</h2><p>Please create a new order.<br>Expired orders cannot be paid.</p><button class="btn" onclick="home()">🏠 Home</button></div>`}};
window.myOrders=()=>app.innerHTML=`<div class="card"><h2>🔑 MY ORDER KEYS</h2>${orders.length?orders.slice().reverse().map(o=>`<div class="card"><b>${e(o.product)}</b><br>${e(o.duration)} · ${money(o.price)}<br>Order: <code>${e(o.orderId)}</code><br>Status: ${e(o.status)}${o.licenseKey?`<div class="key">License: ${e(o.licenseKey)}</div>`:''}</div>`).join(''):'No orders yet.'}<button class="btn alt" onclick="home()">🔙 Back</button></div>`;
window.profile=()=>app.innerHTML=`<div class="card"><h2>👤 YOUR PROFILE</h2><p>Total Orders: <b>${orders.length}</b><br>Total Spent: <b>${money(orders.filter(x=>x.status==='approved').reduce((a,x)=>a+Number(x.price),0))}</b></p><button class="btn alt" onclick="home()">🔙 Back</button></div>`;window.official=()=>location.href='https://t.me/';load();</script></body></html>
