<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BISWA MODS STORE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07121a;color:#eef6fa;font-family:Arial}.app{max-width:560px;margin:auto;height:100vh;display:flex;flex-direction:column;background:#0c1821}header{padding:11px 14px;background:#172631;display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1689ff,#8b4cff);font-size:22px}main{flex:1;overflow:auto;padding:12px;background:radial-gradient(circle at top,#173b49,#07121a 60%)}.row{display:flex;margin:7px 0}.user{justify-content:flex-end}.bubble{max-width:96%;padding:12px;border-radius:12px;background:#172b38;box-shadow:0 2px 8px #0006;animation:in .2s}.user .bubble{background:#176b5b}button,input{width:100%;padding:12px;border-radius:9px;border:1px solid #365166;background:#08131c;color:#fff;margin:5px 0}button{background:#2388d6;border:0;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{padding:11px;margin:7px 0;border-radius:10px;background:#0e202c;border:1px solid #263f51}.qr{display:block;max-width:320px;width:100%;margin:10px auto;background:#fff;padding:8px;border-radius:12px}.count{text-align:center;font-size:28px;font-weight:900}small{color:#9db0ba}.key{font-family:monospace;background:#071018;border:1px solid #45627a}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}</style></head><body><div class=app><header><div class=logo>⚡</div><div><b id=store>BISWA MODS STORE BOT</b><br><small>● online</small></div></header><main id=chat></main></div><script type=module>
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,get,set,update,onValue} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import {getStorage,ref as sref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyAOyV8yiD4hpNCQNVOjqd9bwOEb2ssGx4Q",authDomain:"biswabotstore.firebaseapp.com",databaseURL:"https://biswabotstore-default-rtdb.firebaseio.com",projectId:"biswabotstore",storageBucket:"biswabotstore.firebasestorage.app",messagingSenderId:"661675846800",appId:"1:661675846800:web:e1ea465238ea4eb6b5fc15"};
const app=initializeApp(firebaseConfig),db=getDatabase(app),storage=getStorage(app);
const chat=document.querySelector("#chat"),code=localStorage.bmsCode||(localStorage.bmsCode="BMS-"+crypto.randomUUID().replaceAll("-","").slice(0,10).toUpperCase());
let S={store_name:"BISWA MODS STORE BOT",welcome_message:"WELCOME BISWA MODS STORE BOT",safe_text:"100% Safe & Secure",trusted_text:"100% Trusted",scam_text:"No Scam",premium_text:"Premium Paid Product",developer_text:"All Products Create Biswajit Rabha",download_url:"https://t.me/+iDtXpSdktsgwODQ9",maintenance:false,maintenance_message:"Store is under maintenance.",accept_orders:true},P={},order=null,timer=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>"₹"+Number(n).toLocaleString("en-IN");
function add(x,w="bot"){let r=document.createElement("div");r.className="row "+w;r.innerHTML=`<div class="bubble">${x}<small>${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</small></div>`;chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
async function load(){let a=await get(ref(db,"settings"));if(a.exists())S={...S,...a.val()};let b=await get(ref(db,"products"));if(b.exists())P=b.val();document.querySelector("#store").textContent=S.store_name}
function home(){add(`<b>${esc(S.welcome_message)}</b><br><br>${esc(S.safe_text)}<br>${esc(S.trusted_text)}<br>${esc(S.scam_text)}<br>${esc(S.premium_text)}<br>${esc(S.developer_text)}<br><br><button onclick="shop()">🛍️ SHOP</button><div class="grid"><button onclick="orders()">🔑 MY ORDERS</button><button onclick="profile()">👤 PROFILE</button></div>`)}
window.shop=()=>{if(S.maintenance||S.accept_orders===false)return add(`🔧 ${esc(S.maintenance_message)}`);add("🛍️ SHOP","user");add(`<b>Select Your Device</b><button onclick="android()">📱 Android</button>`)};
window.android=()=>{let a=Object.entries(P).filter(x=>x[1].enabled!==false);add("📱 Android","user");add(a.length?a.map(([id,p])=>`<button onclick="product('${id}')">${esc(p.name)}<br><small>Version: ${esc(p.version||"Latest")}</small></button>`).join(""):"No products available.")};
window.product=id=>{let p=P[id];add(esc(p.name),"user");add(`<b>${esc(p.version||"Latest")}</b><br>${esc(p.description||"")}<br><br>${Object.entries(p.durations||{}).filter(x=>x[1].enabled!==false).map(([d,v])=>`<button onclick="checkout('${id}','${d}')">${esc(v.label)} — ${money(v.price)}</button>`).join("")}`)};
async function qr(price){let x=await get(ref(db,"qr_codes/"+price));return x.exists()?x.val().url:""}
window.checkout=async(id,d)=>{let p=P[id],v=p.durations[d];order={orderId:"BMS-"+crypto.randomUUID().replaceAll("-","").slice(0,12).toUpperCase(),chatCode:code,productId:id,product:p.name,duration:v.label,price:Number(v.price),createdAt:Date.now(),expiresAt:Date.now()+300000,status:"pending"};await set(ref(db,"orders/"+order.orderId),order);payment()};
async function payment(){let q=await qr(order.price);add(`Product: ${esc(order.product)}<br>Duration: ${esc(order.duration)}<br>Price: ${money(order.price)}<br>Order ID: ${order.orderId}<br>Chat Code: ${code}`,"user");add(`${q?`<img class="qr" src="${esc(q)}">`:"<div class=card>QR not configured for this price.</div>"}<div class=count id=ct>05:00</div><small>Complete your payment within 5 minutes.<br>Payments after expiry will not be verified.<br>No key will be delivered.<br>No refund will be provided.</small><button onclick="screen()">📸 SEND PAYMENT SCREENSHOT</button>`);clearInterval(timer);timer=setInterval(()=>{let n=Math.max(0,Math.ceil((order.expiresAt-Date.now())/1000)),e=document.querySelector("#ct");if(e)e.textContent=String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");if(!n){clearInterval(timer);expire()}},250);onValue(ref(db,"orders/"+order.orderId),s=>{let o=s.val();if(!o)return;if(o.status==="generating")add("⚡ <b>Please wait, your order key is generating...</b>");if(o.status==="rejected")add("❌ <b>Payment Rejected</b>");if(o.status==="approved"&&o.license_key)deliver(o)})}
window.screen=()=>add(`<b>📸 Payment Screenshot</b><br><input id=file type=file accept="image/*"><button onclick="sendShot()">📤 SEND SCREENSHOT</button>`);
window.sendShot=async()=>{let f=document.querySelector("#file").files[0];if(!f)return alert("Select screenshot");if(Date.now()>order.expiresAt)return expire();let x=sref(storage,"payment_screenshots/"+order.orderId+"/"+Date.now()+"-"+code);await uploadBytes(x,f);let u=await getDownloadURL(x);await update(ref(db,"orders/"+order.orderId),{status:"payment_submitted",screenshot_url:u,submittedAt:Date.now()});add(`📸 <b>Screenshot sent.</b><br>Chat Code: <b>${code}</b><br><br>⏳ Please wait for admin checking.`)};
async function expire(){let x=await get(ref(db,"orders/"+order.orderId));if(x.val()?.status==="pending"){await update(ref(db,"orders/"+order.orderId),{status:"expired"});add("❌ <b>Payment Expired</b><br><br>Please create a new order.")}}
function deliver(o){add(`<b>🎉 PAYMENT SUCCESSFUL</b><br><br>Product: ${esc(o.product)}<br>Duration: ${esc(o.duration)}<br>Price: ${money(o.price)}<br><br>Your Key:<br><button class=key onclick="copyKey('${esc(o.license_key)}')">${esc(o.license_key)}</button><br><br>Purchase Date: ${new Date(o.approvedAt||Date.now()).toLocaleString()}<br>Expiry Date: ${o.expiry_date?new Date(o.expiry_date).toLocaleString():"Set by admin"}<button onclick="location.href='${esc(S.download_url)}'">⬇️ DOWNLOAD</button>`)}
window.copyKey=async x=>{try{await navigator.clipboard.writeText(x);alert("Key copied!")}catch(e){prompt("Copy key:",x)}};
window.orders=async()=>{let x=await get(ref(db,"orders")),a=Object.values(x.val()||{}).filter(o=>o.chatCode===code).reverse();add("🔑 MY ORDER KEYS","user");add(a.length?a.map(o=>`<div class=card><b>${esc(o.product)}</b><br>Duration: ${esc(o.duration)}<br>Price: ${money(o.price)}<br>Order ID: ${esc(o.orderId)}<br>Status: ${esc(o.status)}${o.license_key?`<br><br><button class=key onclick="copyKey('${esc(o.license_key)}')">${esc(o.license_key)}</button><button onclick="location.href='${esc(S.download_url)}'">⬇️ DOWNLOAD</button>`:""}</div>`).join(""):"No orders found.")};
window.profile=()=>add(`<b>👤 YOUR PROFILE</b><br><br>Your website chat code:<br><button class=key onclick="copyKey('${code}')">${code}</button>`);
load().then(home);
</script></body></html>
