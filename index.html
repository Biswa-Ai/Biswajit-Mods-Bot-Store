<style>

.row{display:flex;margin:8px 0;animation:slide .28s ease}.user{justify-content:flex-end}.bubble{max-width:95%;padding:13px 14px;border:1px solid rgba(255,255,255,.1);border-radius:17px;background:rgba(12,27,39,.86);box-shadow:0 8px 30px #0006;line-height:1.5}.user .bubble{background:linear-gradient(135deg,rgba(0,124,111,.9),rgba(0,86,115,.9))}

@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}main{padding:10px 8px}}
</style></head><body><video id=video autoplay muted loop playsinline><source src="video_back.mp4" type="video/mp4"></video><div class=shade></div><div class=app><header><div class=logo>⚡</div><div><b id=store>BISWA MODS STORE BOT</b><small>● ONLINE • SECURE STORE</small></div></header><main id=chat></main></div><script type=module>

const firebaseConfig={apiKey:"AIzaSyAOyV8yiD4hpNCQNVOjqd9bwOEb2ssGx4Q",authDomain:"biswabotstore.firebaseapp.com",databaseURL:"https://biswabotstore-default-rtdb.firebaseio.com",projectId:"biswabotstore",storageBucket:"biswabotstore.firebasestorage.app",messagingSenderId:"661675846800",appId:"1:661675846800:web:e1ea465238ea4eb6b5fc15"};
const app=initializeApp(firebaseConfig),db=getDatabase(app),storage=getStorage(app);
const chat=document.querySelector("#chat"), code=localStorage.bmsCode||(localStorage.bmsCode="BMS-"+crypto.randomUUID().replaceAll("-","").slice(0,10).toUpperCase());

document.addEventListener("click",e=>{if(e.target.closest("button"))tap()});
let S={store_name:"BISWA MODS STORE BOT",welcome_message:"WELCOME BISWA MODS STORE BOT",safe_text:"100% Safe & Secure",trusted_text:"100% Trusted",scam_text:"No Scam",premium_text:"Premium Paid Product",developer_text:"All Products Create Biswajit Rabha",download_url:"https://t.me/+iDtXpSdktsgwODQ9",channel_url:"https://t.me/+iDtXpSdktsgwODQ9",maintenance:false,maintenance_message:"Store is under maintenance.",accept_orders:true},P={},order=null,timer=null,watching=null;
const defaults={
biswa:{name:"🔥 BISWA PRODUCT",version:"Latest",description:"Premium BISWA MODS product.",enabled:true,durations:{h1:{label:"1 Hour",price:60,enabled:true},h3:{label:"3 Hours",price:130,enabled:true},h6:{label:"6 Hours",price:170,enabled:true}}},
dragon:{name:"🐉 DRAGON PRODUCT",version:"Latest",description:"Premium DRAGON MODS product.",enabled:true,durations:{h1:{label:"1 Hour",price:70,enabled:true},h3:{label:"3 Hours",price:140,enabled:true},h6:{label:"6 Hours",price:180,enabled:true}}},
immortal:{name:"👑 IMMORTAL PRODUCT",version:"Latest",description:"Premium IMMORTAL MODS product.",enabled:true,durations:{d10:{label:"10 Days",price:550,enabled:true},d15:{label:"15 Days",price:700,enabled:true},d30:{label:"30 Days",price:1100,enabled:true},d60:{label:"60 Days",price:1800,enabled:true}}}
};
const fallback={60:"qr_60.png",70:"qr_70.png",120:"qr_120.png",130:"qr_130.png",170:"qr_170.png",180:"qr_180.png",550:"qr_550.png",700:"qr_700.png",1100:"qr_1100.png",1700:"qr_1700.png"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>"₹"+Number(n).toLocaleString("en-IN");
function add(html,who="bot",typing=true){let r=document.createElement("div");r.className="row "+who;let b=document.createElement("div");b.className="bubble";r.appendChild(b);chat.appendChild(r);if(typing){b.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';setTimeout(()=>{b.innerHTML=html+`<small>${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</small>`;chat.scrollTop=chat.scrollHeight},220)}else{b.innerHTML=html}chat.scrollTop=chat.scrollHeight}
async function load(){let a=await get(ref(db,"settings"));if(a.exists())S={...S,...a.val()};let b=await get(ref(db,"products"));P=b.exists()?b.val():{};P={...defaults,...P};document.querySelector("#store").textContent=S.store_name}
function home(){add(`<div class=welcome><b>${esc(S.welcome_message)}</b><br><span>${esc(S.safe_text)}</span><br><span>${esc(S.trusted_text)}</span><br><span>${esc(S.scam_text)}</span><br><span>${esc(S.premium_text)}</span><br><span>${esc(S.developer_text)}</span></div><button onclick="shop()">🛍️ SHOP NOW</button><div class=grid><button onclick="orders()">🔑 MY ORDERS</button><button onclick="profile()">👤 PROFILE</button></div><button class=share onclick="shareStore()">🔗 SHARE BOT STORE</button><button class=clear onclick="clearChat()">🧹 CLEAR CHAT</button>`)}
window.clearChat=()=>{tap();chat.innerHTML="";home()};
window.shareStore=async()=>{let u=location.href;if(navigator.share)try{await navigator.share({title:S.store_name,text:"BISWA MODS STORE",url:u})}catch(e){}else navigator.clipboard?.writeText(u);add("🔗 Store link copied/shared.","user")};
window.shop=()=>{if(S.maintenance||S.accept_orders===false)return add(`🔧 <b>${esc(S.maintenance_message)}</b>`);add("🛍️ SHOP","user");add(`<b>Select Your Device</b><button onclick="android()">📱 ANDROID</button>`)};
window.android=()=>{let a=Object.entries(P).filter(x=>x[1].enabled!==false);add("📱 ANDROID","user");add(a.map(([id,p])=>`<div class=product><div class=ptitle>${esc(p.name)}</div><div class=muted>Version: ${esc(p.version||"Latest")}</div><div class=pdesc>${esc(p.description||"")}</div>${Object.entries(p.durations||{}).filter(x=>x[1].enabled!==false).map(([d,v])=>`<button onclick="checkout('${id}','${d}')">${esc(v.label)} <b>${money(v.price)}</b></button>`).join("")}</div>`).join("")||"No products available.")};
window.product=id=>window.android();
async function getQr(price){try{let x=await get(ref(db,"qr_codes/"+price));if(x.exists()&&x.val().url)return x.val().url}catch(e){}return fallback[price]||""}
window.checkout=async(id,d)=>{let p=P[id],v=p.durations[d];order={orderId:"BMS-"+crypto.randomUUID().replaceAll("-","").slice(0,12).toUpperCase(),chatCode:code,productId:id,product:p.name,duration:v.label,price:Number(v.price),createdAt:Date.now(),expiresAt:Date.now()+300000,status:"pending"};await set(ref(db,"orders/"+order.orderId),order);payment()};
async function payment(){let q=await getQr(order.price);add("💳 PAYMENT","user");add(`<div class=receipt><b>${esc(order.product)}</b><br>Duration: ${esc(order.duration)}<br>Price: <b>${money(order.price)}</b><br>Order ID: <span class=mono>${order.orderId}</span><br>Chat Code: <span class=mono>${code}</span></div>${q?`<img class=qr src="${esc(q)}">`:"<div class=card>⚠️ QR is not configured for this price.</div>"}<div class=count id=ct>05:00</div><div class=warning>Complete your payment within 5 minutes.<br>Payments after expiry will not be verified.<br>No key will be delivered.<br>No refund will be provided.</div><button onclick="screen()">📸 SEND PAYMENT SCREENSHOT</button>`);clearInterval(timer);timer=setInterval(()=>{let n=Math.max(0,Math.ceil((order.expiresAt-Date.now())/1000)),e=document.querySelector("#ct");if(e)e.textContent=String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");if(!n){clearInterval(timer);expire()}},250);if(watching)watching();watching=()=>onValue(ref(db,"orders/"+order.orderId),s=>{let o=s.val();if(!o)return;if(o.status==="generating")add("⚡ <b>Please wait, your order key is generating...</b>");if(o.status==="rejected")add("❌ <b>Payment Rejected</b>");if(o.status==="approved"&&o.license_key&&!document.querySelector("[data-key='"+o.orderId+"']"))deliver(o)}) ;watching()}
window.screen=()=>add(`<div class=card><b>📸 PAYMENT SCREENSHOT</b><input id=file type=file accept="image/*"><button onclick="sendShot()">📤 SEND SCREENSHOT</button></div>`);
window.sendShot=async()=>{let f=document.querySelector("#file").files[0];if(!f)return alert("Select screenshot");if(Date.now()>order.expiresAt)return expire();try{let x=sref(storage,"payment_screenshots/"+order.orderId+"/"+Date.now()+"-"+code);await uploadBytes(x,f);let u=await getDownloadURL(x);await update(ref(db,"orders/"+order.orderId),{status:"payment_submitted",screenshot_url:u,submittedAt:Date.now()});add(`📸 <b>Screenshot sent successfully.</b><br>Chat Code: <span class=mono>${code}</span><br>⏳ Please wait for admin checking.`)}catch(e){add("❌ Screenshot upload failed. Check Firebase Storage rules.")}};
async function expire(){let x=await get(ref(db,"orders/"+order.orderId));if(x.val()?.status==="pending"){await update(ref(db,"orders/"+order.orderId),{status:"expired"});add("❌ <b>Payment Expired</b><br><br>Please create a new order.<br>Expired orders cannot be paid.")}}
function deliver(o){add(`<div data-key="${esc(o.orderId)}"><b>🎉 PAYMENT SUCCESSFUL</b><br><br>Product: ${esc(o.product)}<br>Duration: ${esc(o.duration)}<br>Price: ${money(o.price)}<br>Your Key:<br><button class=key onclick="copyKey('${esc(o.license_key)}')">${esc(o.license_key)}</button><br><br>Purchase Date: ${new Date(o.approvedAt||Date.now()).toLocaleString()}<br>Expiry Date: ${o.expiry_date?new Date(o.expiry_date).toLocaleString():"Set by admin"}<button onclick="location.href='${esc(S.download_url)}'">⬇️ DOWNLOAD</button></div>`)}
window.copyKey=async x=>{try{await navigator.clipboard.writeText(x);add("✅ License key copied.","user",false)}catch(e){prompt("Copy key:",x)}};
window.orders=async()=>{let x=await get(ref(db,"orders")),a=Object.values(x.val()||{}).filter(o=>o.chatCode===code).reverse();add("🔑 MY ORDER KEYS","user");add(a.length?a.map(o=>`<div class=card><b>${esc(o.product)}</b><br>Duration: ${esc(o.duration)}<br>Price: ${money(o.price)}<br>Order ID: ${esc(o.orderId)}<br>Status: ${esc(o.status)}${o.license_key?`<br><br>Your Key:<button class=key onclick="copyKey('${esc(o.license_key)}')">${esc(o.license_key)}</button><button onclick="location.href='${esc(S.download_url)}'">⬇️ DOWNLOAD</button>`:""}</div>`).join(""):"No orders found.")};

load().then(home);
