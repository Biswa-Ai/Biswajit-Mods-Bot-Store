<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BISWA MODS STORE BOT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b141c;color:#e9edef;font-family:Arial,Helvetica,sans-serif}
.app{max-width:520px;margin:auto;height:100vh;display:flex;flex-direction:column;background:#0e1821}
.header{height:62px;background:#17232d;display:flex;align-items:center;padding:8px 14px;gap:11px;box-shadow:0 2px 8px #0006;z-index:2}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#287eff,#7a43ff);font-size:22px}
.name{font-weight:700}.online{font-size:12px;color:#53d58a;margin-top:2px}
.chat{flex:1;overflow-y:auto;padding:16px 10px 24px;background:radial-gradient(circle at 50% 0,#173041 0,#0b141c 55%);scroll-behavior:smooth}
.date{text-align:center;font-size:11px;color:#9ca9b4;background:#182631;border-radius:8px;padding:5px 9px;width:max-content;margin:0 auto 15px}
.row{display:flex;margin:8px 0}.row.bot{justify-content:flex-start}.row.user{justify-content:flex-end}
.bubble{max-width:88%;padding:10px 12px;border-radius:8px;background:#182833;box-shadow:0 1px 2px #0005;animation:in .25s ease}
.user .bubble{background:#176b5a}.time{font-size:10px;color:#93a5af;text-align:right;margin-top:5px}
.welcome{line-height:1.5}.welcome strong{font-size:17px}.welcome .gold{color:#ffd166}.buttons{display:grid;gap:8px;margin-top:12px}
button{border:0;border-radius:9px;background:#2384d7;color:#fff;font-weight:700;padding:12px;cursor:pointer;font-size:14px}
button.secondary{background:#243642}button.green{background:#168c67}button:active{transform:scale(.97)}
.typing{display:flex;gap:4px;padding:12px 14px}.dot{width:6px;height:6px;border-radius:50%;background:#9aaab4;animation:b 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
.hidden{display:none!important}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes b{50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="avatar">⚡</div><div><div class="name">BISWA MODS STORE BOT</div><div class="online">online</div></div></header>
<main id="chat" class="chat"></main>
</div>
<script>
const chat=document.getElementById('chat');
let audioCtx;
function clickSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=520;g.gain.value=.025;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.07)}catch(e){}}
function time(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function add(text,who='bot',html=false){let r=document.createElement('div');r.className='row '+who;let b=document.createElement('div');b.className='bubble';b.innerHTML=html?text:String(text).replace(/\n/g,'<br>')+'<div class="time">'+time()+'</div>';r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return b}
function typing(){let r=document.createElement('div');r.className='row bot';r.id='typing';r.innerHTML='<div class="bubble typing"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>';chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
function removeTyping(){document.getElementById('typing')?.remove()}
function welcome(){
add('<div class="welcome"><strong>WELCOME BISWA MODS STORE BOT</strong><br><span class="gold">100% Safe &amp; Secure</span><br>100% Trusted<br>No Scam<br>Premium Paid Product<br>All Products Create Biswajit Rabha<br><br>Shop now<div class="buttons"><button onclick="shop()">🛍️ SHOP</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="secondary" onclick="orders()">🔑 My Orders</button><button class="secondary" onclick="profile()">👤 Profile</button></div></div></div><div class="time">'+time()+'</div>', 'bot', true)}
function userCommand(){add('/start','user');typing();setTimeout(()=>{removeTyping();welcome()},450)}
function shop(){clickSound();add('🛍️ SHOP','user');typing();setTimeout(()=>{removeTyping();add('<b>Select Your Device</b><div class="buttons"><button onclick="android()">📱 Android</button></div><div class="time">'+time()+'</div>','bot',true)},400)}
function android(){clickSound();add('📱 Android','user');typing();setTimeout(()=>{removeTyping();add('<b>Android Products</b><div class="buttons"><button>🔥 BISWA MODS PRO+</button><button>🐉 DRAGON PANEL</button><button>👑 IMMORTAL PANEL</button></div><div class="time">'+time()+'</div>','bot',true)},400)}
function orders(){clickSound();add('🔑 My Orders','user');typing();setTimeout(()=>{removeTyping();add('🔑 <b>MY ORDER KEYS</b><br><br>No orders found yet.<div class="time">'+time()+'</div>','bot',true)},400)}
function profile(){clickSound();add('👤 Profile','user');typing();setTimeout(()=>{removeTyping();let code=localStorage.getItem('biswa_chat_code')||('BMS-'+Math.random().toString(36).slice(2,10).toUpperCase());localStorage.setItem('biswa_chat_code',code);add('👤 <b>YOUR PROFILE</b><br><br>Your website chat code:<br><b>'+code+'</b><br><br>Give this chat code to admin when support is needed.<div class="time">'+time()+'</div>','bot',true)},400)}
// Automatically simulate /start when the website opens.
window.addEventListener('load',()=>setTimeout(userCommand,250));
</script>
</body>
</html>
